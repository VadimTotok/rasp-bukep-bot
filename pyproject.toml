[project]
name = "bukep-schedule-bot"
version = "0.2.0"
description = "Telegram-бот с расписанием БУКЭП"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "aiohttp>=3.9",
    "cachetools>=5.3",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["ruff==0.16.8", "mypy", "pytest", "pytest-asyncio"]

[project.scripts]
bukep-bot = "bukep_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["aiogram.*", "cachetools.*", "aiosqlite.*", "bs4.*", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bukep_bot.handlers.*"]
disable_error_code = ["union-attr", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"